    - standards-and-policies/example-technology-code-of-practice/
    - standards-and-policies/govs-005/
  note: >-
    Reviewer: the Service Standard and the Technology Code of Practice both
    apply to internal services in central government; GovS 005 covers all
    digital activity. Is there a better answer in the catalogue?

