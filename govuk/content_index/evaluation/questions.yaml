# Questions with known answers, for manage.py evaluate_content_search.
#
# DRAFT: the expected answers were chosen from the catalogue as imported on
# 13 November 2026 and are to be reviewed by someone who knows it. A wrong
# expected answer makes the numbers wrong, so a review matters more than more
# questions.
#
# Each question:
#   question  what someone might type into the question box
#   category  find (names the thing), requirement (what must I do), broad
#             (several answers), paraphrase (shares few or no words with the
#             answer's title), shorthand (an acronym or a typo), out_of_scope
#             (nothing on the site answers it)
#   expect    the answers, as the end of their path on the site; a match
#             inside an entry (one of its points or pages) counts for the
#             entry. Empty for out_of_scope: there, a pass is nothing close.
#   match     any: one of the answers in the top results is a hit (the
#             default); all: every answer should be there (recall)
#   note      optional: why these answers, for the reviewer

