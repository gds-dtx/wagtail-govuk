{% load govuk_filters %}
{% comment %}
    "Use AI search" for this question. Shown by ai-search.js: without JavaScript
    Claude is never used. Disabled while the reader has to sign in first.
    No name: ai-search.js sends the choice as "ai" (1 or 0) while the box is enabled.
{% endcomment %}
<div class="govuk-checkboxes govuk-checkboxes--small app-ai-search-box__choice"
     data-module="govuk-checkboxes"
     data-ai-search-choice
     hidden>
    <div class="govuk-checkboxes__item">
        <input class="govuk-checkboxes__input"
               id="{{ choice.id }}"
               type="checkbox"
               value="1"{% if choice.checked %}
               checked{% endif %}{% if not choice.enabled %}
               disabled{% endif %}>
        <label class="govuk-label govuk-checkboxes__label" for="{{ choice.id }}">
            {% if choice.enabled %}Use AI search. Do not include personal or sensitive information.{% else %}<a class="govuk-link{% if inverse %} govuk-link--inverse{% endif %}" href="{% sign_in_url %}">Sign in</a> to use AI search{% endif %}
        </label>
    </div>
</div>
