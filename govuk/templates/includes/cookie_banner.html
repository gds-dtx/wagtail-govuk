{# Hidden until the script confirms no choice has been made, so people who #}
{# have already chosen never see it flash up on the next page. #}
<div class="govuk-cookie-banner js-cookie-banner"
     data-nosnippet
     role="region"
     aria-label="{{ cookie_banner_settings.heading_for_site }}"
     data-cookies-page-url="{{ cookie_banner_settings.cookies_page_url }}"
     hidden>
    <div class="govuk-cookie-banner__message govuk-width-container js-cookie-banner-question">
        <div class="govuk-grid-row">
            <div class="govuk-grid-column-two-thirds">
                <h2 class="govuk-cookie-banner__heading govuk-heading-m">{{ cookie_banner_settings.heading_for_site }}</h2>
                <div class="govuk-cookie-banner__content">
                    <p class="govuk-body">{{ cookie_banner_settings.analytics_text }}</p>
                    <p class="govuk-body">{{ cookie_banner_settings.essential_text }}</p>
                </div>
            </div>
        </div>
        <div class="govuk-button-group">
            <button type="button"
                    class="govuk-button js-cookie-banner-accept"
                    data-module="govuk-button">Accept analytics cookies</button>
            <button type="button"
                    class="govuk-button js-cookie-banner-reject"
                    data-module="govuk-button">Reject analytics cookies</button>
            <a class="govuk-link" href="{{ cookie_banner_settings.cookies_page_url }}">View cookies</a>
        </div>
    </div>
    <div class="govuk-cookie-banner__message govuk-width-container js-cookie-banner-confirmation"
         role="alert"
         hidden>
        <div class="govuk-grid-row">
            <div class="govuk-grid-column-two-thirds">
                <div class="govuk-cookie-banner__content">
                    <p class="govuk-body js-cookie-banner-confirmation-text"></p>
                </div>
            </div>
        </div>
        <div class="govuk-button-group">
            <button type="button"
                    class="govuk-button js-cookie-banner-hide"
                    data-module="govuk-button">Hide cookie message</button>
        </div>
    </div>
</div>
