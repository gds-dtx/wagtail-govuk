[build-system]
# 77 is where setuptools learned PEP 639, which is how `license` below is
# written. The older `license = {text = "MIT"}` table still works but is on its
# way out, and this project's build environment is resolved fresh each time, so
# there is nothing to gain by holding the older spelling.
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wagtail-govuk"
version = "0.0.1"
description = "Wagtail GOV.UK themed site"
readme = "README.md"
license = "MIT"
license-files = ["LICENCE"]
requires-python = ">=3.12"
dependencies = [
  # Django 6.1 dropped django.utils.cache.cc_delim_re, which Django REST
  # Framework still imports, so an unpinned build stopped starting up. Hold to
  # the 6.0 series until a REST Framework release lands that works with 6.1.
  "Django==6.1.1",
  # Not below 7.4.3: 7.4.1 carried fifteen published advisories, the worst of
  # them PYSEC-2026-616 (CVSS 3.1 AV:N/AC:L/PR:L/UI:R/S:U/C:H/I:H) -- an
  # account with the lowest admin privilege reading and rewriting content it
  # has no permission for.
  "wagtail==8.0",
  "gunicorn==26.2.0",
  "whitenoise==6.12.0",
  "django-allauth[socialaccount,openid]==65.19.4",
  # DRF was previously pulled in only as a dependency of
  # djangorestframework-simplejwt; now that simplejwt is gone (we only verify
  # OIDC tokens, never mint them) it is a direct dependency in its own right.
  # See the Django pin above -- DRF is what constrains us to the 6.0 series.
  "djangorestframework==3.18.1",
  # Verifies OIDC ID tokens against the issuer's JWKS. [crypto] pulls in
  # cryptography for the RS256 signature check.
  "pyjwt[crypto]==2.14.0",
  "psycopg2-binary==2.9.13",
]

[dependency-groups]
# Not needed to run the site, only to check it. CI installs this group.
dev = [
  "ruff==0.16.4",
]

[tool.ruff]
target-version = "py312"
# Generated by makemigrations, and rewriting them to suit a linter is how a
# migration graph gets broken.
extend-exclude = ["govuk/migrations"]

[tool.ruff.lint]
# Pyflakes is the rule set that earns its place here: it is what finds an
# import or a variable nothing reads, and an unused import survived nine
# review passes on this branch because nothing was looking. E4/E7/E9 are
# the errors rather than the style opinions, and I keeps imports ordered.
#
# Deliberately not enabled: RUF012 wants ClassVar on every mutable class
# attribute, which is 217 warnings about `panels = [...]` on Wagtail models
# and no defects, and the SIM/UP families are refactors rather than errors.
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
# Keep `x as y` in the same statement as its neighbours. Without this, one
# aliased name splits a from-import into a statement of its own and the same
# module gets imported from three times over.
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
# Settings modules are composed by star-import on purpose: base.py holds the
# shared settings and each module re-exports them alongside its own.
"govuk/settings/*.py" = ["F403", "F405"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["govuk*"]
