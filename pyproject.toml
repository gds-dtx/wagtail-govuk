[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wagtail-govuk"
version = "0.0.1"
description = "Wagtail GOV.UK themed site"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "Django>=6.0.2",
  "wagtail==7.4.1",
  "gunicorn==26.0.0",
  "whitenoise==6.12.0",
  "django-allauth[socialaccount,openid]==65.17.0",
  "djangorestframework-simplejwt[crypto]>=5.4.0",
  "psycopg2-binary==2.9.12",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["govuk*"]
