[build-system]
# 77+ for the PEP 639 `license` string below.
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wagtail-govuk"
version = "1.3.0"
description = "Wagtail GOV.UK themed site"
readme = "README.md"
license = "MIT"
license-files = ["LICENCE"]
requires-python = ">=3.12"
dependencies = [
  "Django==6.1.3",
  "wagtail==8.1.0",
  "gunicorn==27.0.1",
  "whitenoise==6.12.0",
  "django-allauth[socialaccount,openid]==65.22.1",
  "djangorestframework==3.18.3",
  # OIDC ID tokens; [crypto] for the RS256 signature check.
  "pyjwt[crypto]==2.15.1",
  "psycopg2-binary==2.9.13",
  # Media on S3, only when MEDIA_S3_BUCKET is set (govuk/settings/production.py).
  "django-storages[s3]==1.14.6",
  # HTML allowlist sanitiser.
  "nh3==0.3.8",
  # Markdown parser.
  "markdown-it-py==4.3.0",
  # Content index embeddings in PostgreSQL's vector type.
  "pgvector==0.5.1",
  # MCP server and the ASGI service it runs in. Parts of SDK 2.x are
  # provisional: read its changelog before bumping.
  "mcp==2.3.0",
  "uvicorn==0.54.0",
  # AI search: Claude on Bedrock; [bedrock] brings boto3 for SigV4 signing.
  "anthropic[bedrock]==2.11.0",
  "PyYAML==6.0.3",
]

[dependency-groups]
# Not needed to run the site, only to check it. CI installs this group.
dev = [
  "ruff==0.17.6",
]

[tool.ruff]
target-version = "py312"
# Generated; rewriting them to suit a linter risks the migration graph.
extend-exclude = ["govuk/migrations"]

[tool.ruff.lint]
# Errors... not style. RUF012 is off: it flags every Wagtail `panels = [...]`, etc
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
# Without this, one `x as y` splits a from-import into separate statements.
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
# Settings modules are composed by star-import on purpose: base.py holds the
# shared settings and each module re-exports them alongside its own.
"govuk/settings/*.py" = ["F403", "F405"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["govuk*"]
