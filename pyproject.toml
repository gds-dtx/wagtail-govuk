[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wagtail-govuk"
version = "0.0.1"
description = "Wagtail GOV.UK themed site"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  # Django 6.1 dropped django.utils.cache.cc_delim_re, which Django REST
  # Framework still imports, so an unpinned build stopped starting up. Hold to
  # the 6.0 series until a REST Framework release lands that works with 6.1.
  "Django>=6.0.2,<6.2",
  "wagtail==8.0",
  "gunicorn==26.2.0",
  "whitenoise==6.12.0",
  "django-allauth[socialaccount,openid]==65.19.1",
  "djangorestframework-simplejwt[crypto]>=5.4.0",
  "psycopg2-binary==2.9.12",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["govuk*"]
