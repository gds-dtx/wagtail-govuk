name: GHCR Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: write-all

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: 'Login to GitHub Container Registry'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read app version
        id: app_version
        run: |
          VERSION="$(grep -E '^VERSION[[:space:]]*=[[:space:]]*".*"$' govuk/settings/base.py | sed -E 's/^VERSION[[:space:]]*=[[:space:]]*"([^"]+)"$/\1/')"
          if [ -z "$VERSION" ]; then
            echo "Unable to determine VERSION from govuk/settings/base.py" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: 'Build Inventory Image'
        run: |
          docker build . --no-cache --tag ghcr.io/govuk-digital-backbone/wagtail-govuk:${{ steps.app_version.outputs.version }}
          docker push ghcr.io/govuk-digital-backbone/wagtail-govuk:${{ steps.app_version.outputs.version }}
