name: GHCR Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: write-all

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v6

      - name: 'Login to GitHub Container Registry'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read app version
        id: app_version
        run: |
          WAGTAIL_VERSION="$(grep -E '"wagtail==[0-9\.]+"' pyproject.toml | sed -E 's/.*wagtail==([0-9\.]+).*/\1/')"
          if [ -z "$WAGTAIL_VERSION" ]; then
            echo "Unable to determine Wagtail version from pyproject.toml" >&2
            exit 1
          fi
          RELEASE=$(printf '%03d' "${{ github.run_number }}")
          SHA=$(git rev-parse --short=7 HEAD)
          VERSION="${WAGTAIL_VERSION}-${RELEASE}-${SHA}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: 'Build Inventory Image'
        run: |
          docker build . --no-cache --build-arg VERSION=${{ steps.app_version.outputs.version }} --tag ghcr.io/govuk-digital-backbone/wagtail-govuk:${{ steps.app_version.outputs.version }}
          docker push ghcr.io/govuk-digital-backbone/wagtail-govuk:${{ steps.app_version.outputs.version }}
